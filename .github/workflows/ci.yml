name: nexus-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Build first: the question-bank generator runs from dist (below).
      - run: pnpm build
      # Generate the deterministic bank the acceptance suites validate. It is
      # gitignored (~100 MB) and takes ~4 s, so CI gets the real bank instead of
      # silently skipping those tests via describe.skipIf.
      - name: generate the world-v2 question bank
        run: pnpm --filter @nexus/backend world2:generate
      # Runs every suite AND enforces the per-package coverage thresholds.
      - run: pnpm test:coverage
      - name: i18n parity (shared + explorer)
        run: |
          pnpm --filter @nexus/shared exec vitest run test/i18n.test.ts
          pnpm --filter @nexus/nex32scan exec vitest run src/i18n/index.test.ts

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: cd packages/contracts && forge test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
